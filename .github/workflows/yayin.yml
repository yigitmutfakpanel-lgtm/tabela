# Kahverengi Tabela: siteyi GitHub Pages'e yayınlar; ayda bir OpenStreetMap'ten yer listelerini yeniler.
# İlk kez: Settings → Pages → Source: "GitHub Actions". Gerisi kendiliğinden.
# Elle yenilemek için: Actions → "Yayın ve aylık veri" → Run workflow.
name: Yayın ve aylık veri
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 3 * *" # her ayın 3'ü, 05:23 (Türkiye)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: yayin
  cancel-in-progress: false
jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yer listelerini yenile
        if: github.event_name != 'push'
        continue-on-error: true
        run: node arac/veri.mjs
      - name: Yeni listeyi depoya kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri
          if git diff --cached --quiet; then echo "Değişiklik yok"; else git commit -m "Veri: $(date -u +%Y-%m-%d)" && git push; fi
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons fonts _site/
          if [ -d veri ]; then cp -r veri _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: yayin
        uses: actions/deploy-pages@v4
