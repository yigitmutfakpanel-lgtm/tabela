<script>

// Kategori: [Türkçe ad, simge]
const KAT = {

// Tekilleştirmede hangisi kalsın: düşük sayı = daha belirgin kayıt
const KAT_ONCELIK = { gezi: 9, koruma: 6, kalinti: 5, seyir: 5 };

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const trSirala = (a, b) => a.localeCompare(b, "tr");
const kucuk = (s) => s.toLocaleLowerCase("tr");
const sade = (s) => kucuk(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i").replace(/\s+/g, " ").trim();
const kacir = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function mesafe(a1, o1, a2, o2) {
  const R = 6371000, r = Math.PI / 180;
  const da = (a2 - a1) * r, dO = (o2 - o1) * r;
  const x = Math.sin(da / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function kmYaz(m) {
  const km = m / 1000;
  return (km < 10 ? km.toFixed(1) : Math.round(km).toString()).replace(".", ",") + " km";
}

// ---------------------------------------------------------------------------
// Önbellek (localStorage). 7 gün dolunca yenilenir; yenilenemezse (internet yok)
// eski kayıt silinmez, kullanılır. Böylece uygulama sinyalsiz yerde de çalışır.
// ---------------------------------------------------------------------------
function onbellekKaydi(anahtar) {
  try {
    const ham = localStorage.getItem(ONBELLEK_ONEK + anahtar);
    if (!ham) return null;
    const k = JSON.parse(ham);
    return k && typeof k.t === "number" ? k : null;
  } catch (e) { return null; }
}
async function kayitliYaDaGetir(anahtar, sure, getir, gecerli) {
  const k = onbellekKaydi(anahtar);
  const uygun = k && (!gecerli || gecerli(k.v));
  if (uygun && Date.now() - k.t <= sure) return { v: k.v, t: k.t, eski: false };
  try {
    const v = await getir();
    onbellekYaz(anahtar, v);
    return { v, t: Date.now(), eski: false };
  } catch (e) {
    if (uygun) return { v: k.v, t: k.t, eski: true };
    throw e;
  }
}
// Cihazdaki bütün yer listeleri (internetsiz "Yakınımdakiler" için)
function kayitliTumYerler() {
  const hepsi = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const anahtar = localStorage.key(i);
      if (!anahtar || !anahtar.startsWith(ONBELLEK_ONEK + "y:")) continue;
      const k = onbellekKaydi(anahtar.slice(ONBELLEK_ONEK.length));
      if (k && Array.isArray(k.v)) hepsi.push(...k.v);
    }
  } catch (e) {}
  return hepsi;
}
function onbellekYaz(anahtar, deger) {
  let ham;
  try { ham = JSON.stringify({ t: Date.now(), v: deger }); } catch (e) { return; }
  for (let deneme = 0; deneme < 40; deneme++) {
    try { localStorage.setItem(ONBELLEK_ONEK + anahtar, ham); return; }
    catch (e) { if (!enEskiyiSil(anahtar)) return; }
  }
}
// Yer kalmadıysa en eski kaydı sil (yer listeleri önce)
function enEskiyiSil(haric) {
  try {
    let enEski = null, enT = Infinity;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(ONBELLEK_ONEK) || k === ONBELLEK_ONEK + haric) continue;
      let t = 0;
      try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (e) { t = 0; }
      if (k.startsWith(ONBELLEK_ONEK + "y:")) t -= 1e13; // yer listeleri önce gitsin
      if (t < enT) { enT = t; enEski = k; }
    }
    if (!enEski) return false;
    localStorage.removeItem(enEski);
    return true;
  } catch (e) { return false; }
}
function ayarOku(k) { try { return localStorage.getItem("kt-ayar:" + k); } catch (e) { return null; } }
function ayarYaz(k, v) { try { v == null ? localStorage.removeItem("kt-ayar:" + k) : localStorage.setItem("kt-ayar:" + k, v); } catch (e) {} }

// ---------------------------------------------------------------------------
// Overpass
// ---------------------------------------------------------------------------
async function overpass(sorgu, sure = 75000) {
  let sonHata = null;
  for (const url of SUNUCULAR) {
    const ctl = new AbortController();
    const zaman = setTimeout(() => ctl.abort(), sure);
    try {
      const yanit = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
        body: "data=" + encodeURIComponent(sorgu),
        signal: ctl.signal
      });
      if (!yanit.ok) throw new Error("HTTP " + yanit.status);
      const veri = await yanit.json();
      if (!veri || !Array.isArray(veri.elements)) throw new Error("Geçersiz yanıt");
      // Zaman aşımı/bellek hatası olan yarım yanıtı kabul etme, sıradaki sunucuyu dene
      if (veri.remark && /runtime error|timed out|out of memory|Query timed out/i.test(veri.remark)) throw new Error(veri.remark);
      return veri;
    } catch (e) {
      sonHata = e;
    } finally {
      clearTimeout(zaman);
    }
  }
  throw sonHata || new Error("Bağlantı hatası");
}

function yerFiltreleri(kapsam) {
  return [
    `nwr["tourism"~"^(attraction|museum|viewpoint)$"]["name"]${kapsam};`,
    `nwr["historic"~"^(archaeological_site|castle|fort|ruins|monument|tomb|caravanserai|aqueduct|city_gate|bridge)$"]["name"]${kapsam};`,
    `nwr["natural"~"^(cave_entrance|waterfall|gorge|hot_spring)$"]["name"]${kapsam};`,
    `nwr["boundary"~"^(national_park|protected_area)$"]["name"]${kapsam};`,
    `nwr["leisure"="nature_reserve"]["name"]${kapsam};`,
    `nwr["amenity"="place_of_worship"]["historic"]["name"]${kapsam};`
  ].join("\n  ");
}

// ---------------------------------------------------------------------------
// Kategori ve dönüştürme
// ---------------------------------------------------------------------------
function adaGore(ad) {
  const a = kucuk(ad);
  if (/antik kent|antik şehir|antik kenti/.test(a)) return "antik";
  if (/höyü[kğ]/.test(a)) return "hoyuk";
  if (/şelale|çağlayan/.test(a)) return "selale";
  if (/mağara/.test(a)) return "magara";
  if (/kanyon/.test(a)) return "kanyon";
  if (/kaplıca|ılıca|termal/.test(a)) return "kaplica";
  if (/milli park/.test(a)) return "milli";
  if (/tabiat park/.test(a)) return "tabiat";
  if (/kalesi\b|\bkale\b|hisar/.test(a)) return "kale";
  if (/müze/.test(a)) return "muze";
  if (/kervansaray/.test(a)) return "kervan";
  if (/türbe/.test(a)) return "turbe";
  if (/kümbet/.test(a)) return "kumbet";
  if (/köprü/.test(a)) return "kopru";
  if (/su kemeri/.test(a)) return "kemer";
  if (/cami/.test(a)) return "cami";
  if (/kilise/.test(a)) return "kilise";
  if (/seyir|manzara/.test(a)) return "seyir";
  return null;
}

function kategori(t, ad) {
  const h = t.historic, n = t.natural, tu = t.tourism, a = kucuk(ad);
  if (h && DISLA_HISTORIC.test(h)) {
    // Küçük anma kayıtları dışarıda; yalnız müze ya da Vikipedi maddesi olan önemli anıtlar kalır
    if (tu === "museum") return "muze";
    if (tu === "attraction" && (t.wikipedia || t.wikidata)) return "anit";
    return null;
  }
  if (n === "waterfall") return "selale";
  if (n === "cave_entrance") return "magara";
  if (n === "gorge") return "kanyon";
  if (n === "hot_spring") return "kaplica";
  if (tu === "museum" && /müze/.test(a)) return "muze";
  switch (h) {
    case "archaeological_site":
      if (/höyü[kğ]/.test(a) || t.archaeological_site === "tumulus" || t.site_type === "tumulus") return "hoyuk";
      if (/antik kent|antik şehir/.test(a) || t.site_type === "city" || t.archaeological_site === "city") return "antik";
      return "oren";
    case "castle": case "fort": return "kale";
    case "ruins": return adaGore(ad) || "kalinti";
    case "monument": return "anit";
    case "tomb": return /kümbet/.test(a) ? "kumbet" : "turbe";
    case "caravanserai": return /kervansaray/.test(a) ? "kervan" : (/\bhan(ı)?\b/.test(a) ? "han" : "kervan");
    case "aqueduct": return "kemer";
    case "city_gate": return "kapi";
    case "bridge": return "kopru";
  }
  if (tu === "museum") return "muze";
  if (t.boundary === "national_park") return "milli";
  if (t.boundary === "protected_area" || t.leisure === "nature_reserve") {
    const g = adaGore(ad);
    if (g === "milli" || g === "tabiat" || g === "kanyon" || g === "magara" || g === "selale") return g;
    return "koruma";
  }
  if (t.amenity === "place_of_worship" && h) {
    const din = t.religion;
    if (din === "muslim") return /türbe/.test(a) ? "turbe" : "cami";
    if (din === "christian") return "kilise";
    if (din === "jewish") return "sinagog";
    return adaGore(ad) || "mabet";
  }
  if (tu === "viewpoint") return "seyir";
  if (tu === "attraction") return adaGore(ad) || "gezi";
  return null;
}

function vikipedi(t) {
  let deger = t.wikipedia, dil = null;
  if (!deger && t["wikipedia:tr"]) { dil = "tr"; deger = t["wikipedia:tr"]; }
  if (!deger) return null;
  const m = /^([a-z\-]{2,12}):(.+)$/.exec(deger);
  if (m) { dil = m[1]; deger = m[2]; }
  if (/^https?:\/\//.test(deger)) return deger;
  return `https://${dil || "tr"}.wikipedia.org/wiki/${encodeURIComponent(deger.trim().replace(/ /g, "_"))}`;
}

// Kısa kayıt: { n: ad, a: enlem, o: boylam, c: kategori, w: vikipedi }
function kayitYap(el) {
  const t = el.tags || {};
  const ad = (t["name:tr"] || t.name || "").trim();
  if (!ad) return null;
  const enlem = el.lat != null ? el.lat : el.center && el.center.lat;
  const boylam = el.lon != null ? el.lon : el.center && el.center.lon;
  if (enlem == null || boylam == null) return null;
  const c = kategori(t, ad);
  if (!c) return null;
  const k = { n: ad, a: Math.round(enlem * 1e5) / 1e5, o: Math.round(boylam * 1e5) / 1e5, c };
  const w = vikipedi(t);
  if (w) k.w = w;
  return k;
}

function tekillestir(kayitlar) {
  const puan = (k) => (KAT_ONCELIK[k.c] || 1) - (k.w ? 0.5 : 0);
  const sirali = kayitlar.slice().sort((x, y) => puan(x) - puan(y));
  const gruplar = new Map();
  const sonuc = [];
  for (const k of sirali) {
    const anahtar = sade(k.n);
    const grup = gruplar.get(anahtar) || [];
    const ayni = grup.find((g) => mesafe(g.a, g.o, k.a, k.o) < TEKIL_MESAFE);
    if (ayni) { if (!ayni.w && k.w) ayni.w = k.w; continue; }
    grup.push(k);
    gruplar.set(anahtar, grup);
    sonuc.push(k);
  }
  return sonuc;
}

function yerleriIsle(veri) {
  const kayitlar = [];
  for (const el of veri.elements) {
    const k = kayitYap(el);
    if (k) kayitlar.push(k);
  }
  return tekillestir(kayitlar).sort((x, y) => trSirala(x.n, y.n));
}

// 81 ilin OSM ilişki kimlikleri (tek sorgu, önbellekte)
async function ilKimlikleri() {
  const s = await kayitliYaDaGetir("iller", 30 * GUN, ilKimlikleriGetir, (v) => v && Object.keys(v).length >= 70);
  return s.v;
}
async function ilKimlikleriGetir() {
  const veri = await overpass(`[out:json][timeout:60];
area["ISO3166-1"="TR"]["admin_level"="2"]->.tr;
rel(area.tr)["boundary"="administrative"]["admin_level"="4"];
out tags;`);
  const isoIle = {}, adIle = {};
  for (const el of veri.elements) {
    const t = el.tags || {};
    const iso = /^TR-(\d{2})$/.exec(t["ISO3166-2"] || "");
    if (iso) isoIle[+iso[1]] = el.id;
    for (const ad of [t.name, t["name:tr"], t.official_name]) {
      if (ad) adIle[sade(ad).replace(/ ili$/, "")] = el.id;
    }
  }
  const sonuc = {};
  for (const [plaka, ad] of ILLER) {
    const id = isoIle[plaka] || adIle[sade(ad)];
    if (id) sonuc[plaka] = id;
  }
  if (Object.keys(sonuc).length === 0) throw new Error("İl sınırları bulunamadı");
  return sonuc;
}

async function ilceler(ilId, ilAdi) {
  const s = await kayitliYaDaGetir("ilce:" + ilId, 30 * GUN, () => ilceleriGetir(ilId, ilAdi), (v) => Array.isArray(v) && v.length > 0);
  return s.v;
}
async function ilceleriGetir(ilId, ilAdi) {
  // Komşu illerin ilçeleri ortak sınır yüzünden alana takılabilir.
  // Bu yüzden merkezi (admin_centre / label) il alanı içinde kalan ilçeleri esas alıyoruz.
  const veri = await overpass(`[out:json][timeout:60];
area(${ALAN_TABANI + ilId})->.il;
rel(area.il)["boundary"="administrative"]["admin_level"="6"]->.aday;
node(r.aday:"admin_centre")(area.il)->.m1;
node(r.aday:"label")(area.il)->.m2;
(.m1; .m2;)->.merkez;
(rel(bn.merkez:"admin_centre")["boundary"="administrative"]["admin_level"="6"];
 rel(bn.merkez:"label")["boundary"="administrative"]["admin_level"="6"];)->.kesin;
.kesin out tags;
(.aday; - .kesin;)->.diger;
.diger out tags center;`);
  const kesin = [], diger = [];
  const ilSade = sade(ilAdi);
  for (const el of veri.elements) {
    if (el.type !== "relation") continue;
    const t = el.tags || {};
    const ad = t["name:tr"] || t.name;
    if (!ad) continue;
    const kayit = { id: el.id, n: ad };
    if (el.center) {
      const isIn = sade(t["is_in:province"] || t.is_in || "");
      if (isIn && isIn.includes(ilSade)) kesin.push(kayit); else diger.push(kayit);
    } else kesin.push(kayit);
  }
  // Merkez noktası hiç işaretlenmemiş illerde (nadir) aday listesinin tamamını kullan
  const liste = kesin.length ? kesin : diger;
  const tekil = [];
  const gorulen = new Set();
  for (const k of liste) if (!gorulen.has(k.id)) { gorulen.add(k.id); tekil.push(k); }
  tekil.sort((x, y) => trSirala(x.n, y.n));
  return tekil;
}

// { v: yerler, t: kayıt zamanı, eski: internet yokken eski kayıt mı }
function bolgeYerleri(alanRelId) {
  return kayitliYaDaGetir("y:" + alanRelId, ONBELLEK_SURESI, () => bolgeYerleriGetir(alanRelId), Array.isArray);
}
async function bolgeYerleriGetir(alanRelId) {
  const veri = await overpass(`[out:json][timeout:60];
area(${ALAN_TABANI + alanRelId})->.a;
(
  ${yerFiltreleri("(area.a)")}
);
out center tags;`);
  return yerleriIsle(veri);
}

// İnternet yoksa cihazda kayıtlı illerden/ilçelerden hesaplanır: { v, eski }
async function yakinYerler(enlem, boylam) {
  const hazir = await yerelYakin(enlem, boylam);
  if (hazir) return { eski: false, v: hazir };
  let kayitlar, eski = false;
  try {
    const veri = await overpass(`[out:json][timeout:60];
(
  ${yerFiltreleri(`(around:${YAKIN_YARICAP},${enlem.toFixed(5)},${boylam.toFixed(5)})`)}
);
out center tags;`);
    kayitlar = yerleriIsle(veri);
  } catch (e) {
    const yakin = kayitliTumYerler().filter((k) => mesafe(enlem, boylam, k.a, k.o) <= YAKIN_YARICAP);
    if (!yakin.length) throw e;
    kayitlar = tekillestir(yakin);
    eski = true;
  }
  return { eski, v: yakinSirala(kayitlar, enlem, boylam) };
}
function yakinSirala(kayitlar, enlem, boylam) {
  return kayitlar
    .map((k) => Object.assign({}, k, { d: mesafe(enlem, boylam, k.a, k.o) }))
    .filter((k) => k.d <= YAKIN_YARICAP)
    .sort((x, y) => x.d - y.d || trSirala(x.n, y.n));
}

// ---------------------------------------------------------------------------
// Aylık hazır veri (veri/ klasörü, GitHub'da ayda bir yenilenir). Varsa önce o kullanılır,
// harita sunucusuna gerek kalmaz. Yoksa ya da açılamazsa canlı sorguya dönülür.
// ---------------------------------------------------------------------------
const VERI_YOLU = "veri/";
let yerelIndeks = null;
async function yerelIndeksi() {
  if (yerelIndeks) return yerelIndeks;
  try {
    const r = await fetch(VERI_YOLU + "iller.json");
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.iller || !Object.keys(j.iller).length) return null;
    yerelIndeks = j;
    const t = $("veriTarih");
    if (t && j.tarih) t.textContent = ` Liste tarihi: ${j.tarih.split("-").reverse().join(".")}.`;
    return j;
  } catch (e) { return null; }
}
const ilDosyalari = new Map();
function yerelIl(plaka) {
  if (!ilDosyalari.has(plaka)) {
    const s = fetch(`${VERI_YOLU}il/${String(plaka).padStart(2, "0")}.json`)
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then((j) => { if (!j || !j.ilceler) throw new Error("Geçersiz dosya"); return j; });
    s.catch(() => ilDosyalari.delete(plaka));
    ilDosyalari.set(plaka, s);
  }
  return ilDosyalari.get(plaka);
}
async function yerelBolge(plaka, relId, tumIl) {
  const ix = await yerelIndeksi();
  if (!ix || !ix.iller[plaka]) return null;
  try {
    const d = await yerelIl(plaka);
    if (tumIl) return tekillestir(Object.values(d.ilceler).flat()).sort((x, y) => trSirala(x.n, y.n));
    return Array.isArray(d.ilceler[relId]) ? d.ilceler[relId] : null;
  } catch (e) { return null; }
}
async function yerelYakin(enlem, boylam) {
  const ix = await yerelIndeksi();
  if (!ix) return null;
  const pay = 0.35; // ~30 km
  const adaylar = Object.keys(ix.iller).filter((p) => {
    const k = ix.iller[p].k;
    return k && enlem >= k[0] - pay && enlem <= k[2] + pay && boylam >= k[1] - pay * 1.4 && boylam <= k[3] + pay * 1.4;
  });
  if (!adaylar.length) return null; // Türkiye dışı: canlı sorgu
  try {
    const dosyalar = await Promise.all(adaylar.map((p) => yerelIl(+p)));
    const hepsi = dosyalar.flatMap((d) => Object.values(d.ilceler).flat())
      .filter((k) => mesafe(enlem, boylam, k.a, k.o) <= YAKIN_YARICAP);
    return yakinSirala(tekillestir(hepsi), enlem, boylam);
  } catch (e) { return null; }
}

const durum = {
  kip: "bolge",        // "bolge" | "yakin"
  yerler: [],
  filtre: "",          // kategori anahtarı, "" = tümü
  arama: "",
  gosterilen: SAYFA,
  istek: 0,            // eski yanıtları yok saymak için sayaç
  sonIs: null,         // "Tekrar dene" için
  bolgeAdi: ""
};

const el = { il: $("il"), ilce: $("ilce"), yakin: $("yakin"), ara: $("ara"), cipler: $("cipler"), ozet: $("ozet"), icerik: $("icerik") };

function haritaAdresi(k) {
  return `https://www.google.com/maps/dir/?api=1&destination=${k.a},${k.o}&travelmode=driving`;
}

function yukleniyor(metin) {
  el.ozet.textContent = "";
  el.cipler.innerHTML = "";
  el.ara.disabled = true;
  el.icerik.innerHTML = `<div class="durum" role="status"><div class="donen" aria-hidden="true"></div><h2>${kacir(metin)}</h2><p>Kalabalık illerde bu bir dakikayı bulabilir.</p></div>`;
}

function hataGoster(baslik, aciklama, tekrar) {
  el.ozet.textContent = "";
  el.cipler.innerHTML = "";
  el.ara.disabled = true;
  durum.sonIs = tekrar || null;
  el.icerik.innerHTML = `<div class="durum" role="alert"><div class="buyuk-ikon" aria-hidden="true">⚠️</div><h2>${kacir(baslik)}</h2><p>${kacir(aciklama)}</p>${tekrar ? '<button type="button" id="tekrar">Tekrar dene</button>' : ""}</div>`;
  if (tekrar) $("tekrar").addEventListener("click", tekrar);
}

function bilgiGoster(simge, baslik, aciklama) {
  el.ozet.textContent = "";
  el.cipler.innerHTML = "";
  el.ara.disabled = true;
  el.icerik.innerHTML = `<div class="durum"><div class="buyuk-ikon" aria-hidden="true">${simge}</div><h2>${kacir(baslik)}</h2>${aciklama ? `<p>${kacir(aciklama)}</p>` : ""}</div>`;
}

function yerleriGoster(yerler, bolgeAdi, eskiNot) {
  durum.yerler = yerler;
  durum.eskiNot = eskiNot || "";
  durum.bolgeAdi = bolgeAdi;
  durum.filtre = "";
  durum.arama = "";
  el.ara.value = "";
  el.ara.disabled = yerler.length === 0;
  cipleriCiz();
  listeyiCiz();
}

function cipleriCiz() {
  if (!durum.yerler.length) { el.cipler.innerHTML = ""; return; }
  const sayac = {};
  for (const k of durum.yerler) sayac[k.c] = (sayac[k.c] || 0) + 1;
  const anahtarlar = Object.keys(sayac).sort((x, y) => trSirala(KAT[x][0], KAT[y][0]));
  let html = `<button type="button" class="cip" data-k="" aria-pressed="${durum.filtre === ""}">Tümü <span class="s">${durum.yerler.length}</span></button>`;
  for (const k of anahtarlar) {
    html += `<button type="button" class="cip" data-k="${k}" aria-pressed="${durum.filtre === k}"><span aria-hidden="true">${KAT[k][1]}</span>${kacir(KAT[k][0])} <span class="s">${sayac[k]}</span></button>`;
  }
  el.cipler.innerHTML = html;
}

function suzulmus() {
  const q = sade(durum.arama);
  return durum.yerler.filter((k) =>
    (!durum.filtre || k.c === durum.filtre) &&
    (!q || sade(k.n).includes(q) || sade(KAT[k.c][0]).includes(q)));
}

function kartHtml(k) {
  const [katAdi, simge] = KAT[k.c];
  const uzak = k.d != null ? `<span class="uzak">${kmYaz(k.d)}</span>` : "";
  const wiki = k.w ? `<a class="wiki" href="${kacir(k.w)}" target="_blank" rel="noopener">📖 Vikipedi</a>` : "";
  return `<li class="kart"><a class="git" href="${haritaAdresi(k)}" target="_blank" rel="noopener" aria-label="${kacir(k.n)}, ${kacir(katAdi)}: Google Haritalar'da yol tarifi">` +
    `<span class="ikon" aria-hidden="true"><span>${simge}</span></span>` +
    `<span class="metin"><span class="ad">${kacir(k.n)}</span><span class="tur">${kacir(katAdi)}</span></span>` +
    uzak +
    `<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>` +
    `</a>${wiki}</li>`;
}

function listeyiCiz() {
  const liste = suzulmus();
  const toplam = durum.yerler.length;
  if (toplam === 0) {
    bilgiGoster("🧭", "Bu bölgede kayıt bulunamadı",
      durum.kip === "yakin" ? "30 km çevrende kayıtlı turistik yer yok." : "Başka bir ilçe ya da \"Tüm il\" seçebilirsin.");
    return;
  }
  const yer = durum.kip === "yakin" ? "30 km çevrende" : durum.bolgeAdi;
  el.ozet.innerHTML = liste.length === toplam
    ? `${kacir(yer)}: <b>${toplam}</b> yer bulundu`
    : `${kacir(yer)}: <b>${liste.length}</b> / ${toplam} yer gösteriliyor`;
  if (durum.eskiNot) el.ozet.innerHTML += `<div class="not">📴 ${kacir(durum.eskiNot)}</div>`;
  if (liste.length === 0) {
    el.icerik.innerHTML = `<div class="durum"><div class="buyuk-ikon" aria-hidden="true">🔎</div><h2>Eşleşen yer yok</h2><p>Aramayı ya da kategori filtresini değiştir.</p></div>`;
    return;
  }
  const gorunen = liste.slice(0, durum.gosterilen);
  let html = `<ul class="liste">${gorunen.map(kartHtml).join("")}</ul>`;
  if (liste.length > gorunen.length) {
    html += `<button type="button" class="daha" id="daha">Daha fazla göster (${liste.length - gorunen.length} yer daha)</button>`;
  }
  el.icerik.innerHTML = html;
  const daha = $("daha");
  if (daha) daha.addEventListener("click", () => { durum.gosterilen += SAYFA * 2; listeyiCiz(); });
}

async function ilSecildi(plaka, hedefIlce) {

  durum.gosterilen = SAYFA;
  if (!plaka) {
    ilceSecenekleriTemizle("İlçe seç");
    ayarYaz("il", null); ayarYaz("ilce", null);
    baslangic();
    return;
  }
  ayarYaz("il", String(plaka));
  const ad = ilAdi(plaka);
  ilceSecenekleriTemizle("Yükleniyor…");
  yukleniyor(`${ad} ilçeleri yükleniyor…`);
  try {
    const ix = await yerelIndeksi();
    if (no !== durum.istek) return;
    const hazir = ix && ix.iller[plaka];
    let ilId, liste;
    if (hazir && hazir.ilce && hazir.ilce.length) {
      ilId = hazir.id;
      liste = hazir.ilce.slice().sort((x, y) => trSirala(x.n, y.n));
    } else {
      const kimlikler = await ilKimlikleri();
      if (no !== durum.istek) return;
      ilId = kimlikler[plaka];
      if (!ilId) throw Object.assign(new Error("yok"), { bulunamadi: true });
      liste = await ilceler(ilId, ad);
    }
    if (no !== durum.istek) return;
    el.ilce.innerHTML = `<option value="il:${ilId}">Tüm il</option>` +
      liste.map((d) => `<option value="${d.id}">${kacir(d.n)}</option>`).join("");
    el.ilce.disabled = false;
    let secili = "il:" + ilId;
    if (hedefIlce && liste.some((d) => String(d.id) === hedefIlce)) secili = hedefIlce;
    el.ilce.value = secili;
    await ilceSecildi(no);
  } catch (e) {
    if (no !== durum.istek) return;
    ilceSecenekleriTemizle("İlçe seç");
    if (e && e.bulunamadi) hataGoster("İl bulunamadı", `${ad} için OpenStreetMap'te sınır kaydı bulunamadı.`, () => ilSecildi(plaka));
    else hataGoster("Bağlantı hatası", baglantiAciklama("Harita sunucularına ulaşılamadı."), () => ilSecildi(plaka, hedefIlce));
  }
}

async function ilceSecildi(mevcutNo) {
  yakinKipiKapat();
  const no = mevcutNo || ++durum.istek;
  durum.gosterilen = SAYFA;
  const deger = el.ilce.value;
  if (!deger) return;
  const tumIl = deger.startsWith("il:");
  const relId = +(tumIl ? deger.slice(3) : deger);
  const plaka = +el.il.value;
  const bolgeAdi = tumIl ? `${ilAdi(plaka)} (tüm il)` : `${el.ilce.options[el.ilce.selectedIndex].text}, ${ilAdi(plaka)}`;
  ayarYaz("ilce", tumIl ? null : deger);
  yukleniyor(`${bolgeAdi} yerleri yükleniyor…`);
  try {
    const hazir = await yerelBolge(plaka, relId, tumIl);
    if (hazir) onbellekYaz("y:" + relId, hazir); // internetsiz "Yakınımdakiler" için de cihazda dursun
    const s = hazir ? { v: hazir, eski: false } : await bolgeYerleri(relId);
    if (no !== durum.istek) return;
    yerleriGoster(s.v, bolgeAdi, s.eski ? `İnternet yok: ${tarihYaz(s.t)} kaydedilen liste gösteriliyor.` : "");
  } catch (e) {
    if (no !== durum.istek) return;
    hataGoster("Bağlantı hatası", baglantiAciklama("Yerler yüklenemedi."), () => ilceSecildi());
  }
}

function yakinimdakiler() {
  if (durum.kip === "yakin") { // ikinci dokunuş: bölge listesine dön
    yakinKipiKapat();
    if (el.ilce.value) ilceSecildi(); else baslangic();
    return;
  }
  durum.kip = "yakin";
  el.yakin.setAttribute("aria-pressed", "true");
  const no = ++durum.istek;
  durum.gosterilen = SAYFA;
  if (!("geolocation" in navigator)) {
    hataGoster("Konum alınamadı", "Bu tarayıcı konum özelliğini desteklemiyor.");
    return;
  }
  yukleniyor("Konumun alınıyor…");
  navigator.geolocation.getCurrentPosition(async (konum) => {
    if (no !== durum.istek) return;
    const { latitude, longitude } = konum.coords;
    yukleniyor("Yakınındaki yerler aranıyor…");
    try {
      const s = await yakinYerler(latitude, longitude);
      if (no !== durum.istek) return;
      yerleriGoster(s.v, "30 km çevrende", s.eski ? "İnternet yok: cihazda kayıtlı illerden hesaplandı, eksik olabilir." : "");
    } catch (e) {
      if (no !== durum.istek) return;
      hataGoster("Bağlantı hatası", baglantiAciklama("Yakındaki yerler yüklenemedi."), () => { yakinKipiKapat(); yakinimdakiler(); });
    }
  }, (hata) => {
    if (no !== durum.istek) return;
    const izinYok = hata && hata.code === 1;
    hataGoster("Konum alınamadı",
      izinYok ? "Konum izni verilmedi. Tarayıcı ayarlarından bu siteye konum izni verip tekrar dene." : "Konumun belirlenemedi. Konum servisinin açık olduğundan emin olup tekrar dene.",
      () => { yakinKipiKapat(); yakinimdakiler(); });
  }, { enableHighAccuracy: false, timeout: 20000, maximumAge: 5 * 60 * 1000 });
}

function baslangic() {
  bilgiGoster("🪧", "Bir il seç", "Kahverengi tabelalı yerler il ve ilçeye göre listelenir. Bir yere dokununca Google Haritalar yol tarifiyle açılır.");
}

function tarihYaz(t) {
  const gun = Math.floor((Date.now() - t) / GUN);
  if (gun <= 0) return "bugün";
  if (gun === 1) return "dün";
  return `${gun} gün önce`;
}
function baglantiAciklama(bas) {
  return navigator.onLine === false
    ? `${bas} İnternet yok ve bu bölge bu cihazda daha önce açılmamış. İnternete bağlanınca bir kez aç; sonra internetsiz de görünür.`
    : `${bas} İnternet bağlantını kontrol edip tekrar dene.`;
}

// ---------------------------------------------------------------------------
// Uygulama: çevrimdışı katman, kalıcı depolama, ana ekrana ekleme
// ---------------------------------------------------------------------------
const tekBasina = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

function cevrimDurumu() { $("cevrimdisi").hidden = navigator.onLine !== false; }

function uygulamaKur() {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  // Tarayıcı yer açmak için kayıtları silmesin
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  window.addEventListener("online", cevrimDurumu);
  window.addEventListener("offline", cevrimDurumu);
  cevrimDurumu();

  if (tekBasina() || ayarOku("kurKapali")) return;
  const serit = $("kurSerit"), dugme = $("kurDugme"), yazi = $("kurYazi");
  $("kurKapat").addEventListener("click", () => { serit.hidden = true; ayarYaz("kurKapali", "1"); });

  let bekleyen = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    bekleyen = e;
    yazi.textContent = "Uygulama gibi kullanmak için ana ekrana ekle. İnternetsiz de açılır.";
    dugme.hidden = false;
    serit.hidden = false;
  });
  dugme.addEventListener("click", async () => {
    if (!bekleyen) return;
    bekleyen.prompt();
    try { await bekleyen.userChoice; } catch (e) {}
    bekleyen = null;
    serit.hidden = true;
  });
  window.addEventListener("appinstalled", () => { serit.hidden = true; });

  // iPhone/iPad: düğme yok, Safari menüsünden eklenir
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) {
    yazi.textContent = "Ana ekrana eklemek için: alttaki Paylaş düğmesi (kare ve ok) → “Ana Ekrana Ekle”.";
    dugme.hidden = true;
    serit.hidden = false;
  }
}

// ---------------------------------------------------------------------------
// Olaylar
// ---------------------------------------------------------------------------
el.il.addEventListener("change", () => ilSecildi(+el.il.value || 0));
el.ilce.addEventListener("change", () => ilceSecildi());
el.yakin.addEventListener("click", yakinimdakiler);
el.ara.addEventListener("input", () => { durum.arama = el.ara.value; durum.gosterilen = SAYFA; listeyiCiz(); });
el.cipler.addEventListener("click", (e) => {
  const b = e.target.closest(".cip");
  if (!b) return;
  durum.filtre = b.dataset.k === durum.filtre ? "" : b.dataset.k;
  durum.gosterilen = SAYFA;
  for (const c of el.cipler.querySelectorAll(".cip")) c.setAttribute("aria-pressed", String(c.dataset.k === durum.filtre));
  listeyiCiz();
});

ilSecenekleri();
uygulamaKur();
(function () {
  const sonIl = +(ayarOku("il") || 0);
  if (sonIl && ILLER.some((i) => i[0] === sonIl)) {
    el.il.value = String(sonIl);
    ilSecildi(sonIl, ayarOku("ilce"));
  } else baslangic();
})();
</script>
