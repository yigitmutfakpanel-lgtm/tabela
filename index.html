  $("buyukSira").textContent = `${buyukSira + 1} / ${acikFotolar.length}`;
  $("buyukKunye").innerHTML = fotoKunye(f);
  $("buyukOnceki").hidden = $("buyukSonraki").hidden = acikFotolar.length < 2;
  $("buyukFoto").hidden = false;
  $("buyukKapat").focus();
}
function buyukKapat() { $("buyukFoto").hidden = true; $("buyukResim").removeAttribute("src"); }

// --- Sesli rehber: önce hazır ses kaydı, yoksa cihazın Türkçe sesi, o da yoksa yalnız metin
const sureYaz = (sn) => { sn = Math.max(0, Math.round(sn || 0)); return `${Math.floor(sn / 60)}:${String(sn % 60).padStart(2, "0")}`; };
const ROMA_SIRA = { I: "Birinci", II: "İkinci", III: "Üçüncü", IV: "Dördüncü", V: "Beşinci", VI: "Altıncı", VII: "Yedinci", VIII: "Sekizinci", IX: "Dokuzuncu", X: "Onuncu" };
// Sesli okuma için kısaltmaları açar (arac/ses.mjs ile aynı kurallar: hazır ses ile cihaz sesi aynı metni okur)
function okunabilirMetin(s) {
  return s
    .replace(/(?<!\p{L})MÖ(?!\p{L})/gu, "milattan önce").replace(/(?<!\p{L})MS(?!\p{L})/gu, "milattan sonra")
    .replace(/\bHz\.\s/g, "Hazreti ")
    .replace(/\b(I|II|III|IV|V|VI|VII|VIII|IX|X)\.\s(?=\p{Lu})/gu, (m, r) => ROMA_SIRA[r] + " ")
    .replace(/(\d)\s?°C/g, "$1 derece").replace(/(\d)\s?km\b/g, "$1 kilometre").replace(/(\d)\s?m\b/g, "$1 metre")
    .replace(/(\d)\s?-\s?(\d)/g, "$1 ile $2")
    .replace(/[“”"]/g, "").replace(/\s+/g, " ").trim();
}
function anlatimMetni(ic) {
  const parcalar = [ic.ad + ".", ic.kisa];
  for (const b of ic.bolumler || []) parcalar.push(b.baslik + (/[.?!]$/.test(b.baslik) ? " " : ". ") + b.metin);
  if (ic.ilginc && ic.ilginc.length) { parcalar.push("Biliyor muydunuz?"); for (const i of ic.ilginc) parcalar.push(i.metin); }
  return okunabilirMetin(parcalar.join(" "));
}
function sesArayuzu() {
  return {
    ana: $("sesAna"), ilerleme: $("sesIlerleme"), simdi: $("sesSimdi"), toplam: $("sesToplam"),
    geri: $("sesGeri"), ileri: $("sesIleri"), bastan: $("sesBastan"), hiz: $("sesHiz"), not: $("sesNot"),
    etkin(e) { for (const x of [this.ilerleme, this.geri, this.ileri, this.bastan]) x.disabled = !e; },
    calisiyor(c) { this.ana.textContent = c ? "⏸ Duraklat" : "▶ Sesli Rehberi Dinle"; this.ana.setAttribute("aria-pressed", String(c)); }
  };
}
function sesOynatici(reh) {
  const a = sesArayuzu();
  if (!a.ana) return null;
  if (reh.ic.ses) return kayitliSes(a, reh.ic, () => cihazSesi(a, reh.ic));
  return cihazSesi(a, reh.ic);
}
function kayitliSes(a, ic, yedek) {
  const ses = new Audio();
  ses.preload = "metadata";
  let blobUrl = null, hazir = false, devir = null;
  const kaynak = mutlak(ic.ses.dosya);
  const yukle = async () => {
    if (hazir) return;
    try {
      const mk = "caches" in window ? await caches.open(MEDYA_KABI) : null;
      const kayit = mk && await mk.match(kaynak);
      if (kayit) { blobUrl = URL.createObjectURL(await kayit.blob()); ses.src = blobUrl; }
      else ses.src = kaynak;
    } catch (e) { ses.src = kaynak; }
    hazir = true;
  };
  a.not.textContent = "Hazır sesli anlatım. " + ic.ses.lisans + ".";
  if (ic.ses.sure) a.toplam.textContent = sureYaz(ic.ses.sure);
  ses.addEventListener("loadedmetadata", () => { a.toplam.textContent = sureYaz(ses.duration); a.etkin(true); });
  ses.addEventListener("timeupdate", () => { a.simdi.textContent = sureYaz(ses.currentTime); if (ses.duration) a.ilerleme.value = Math.round((ses.currentTime / ses.duration) * 1000); });
  ses.addEventListener("play", () => a.calisiyor(true));
  ses.addEventListener("pause", () => a.calisiyor(false));
  ses.addEventListener("ended", () => { a.calisiyor(false); a.ilerleme.value = 1000; });
  ses.addEventListener("error", () => {
    if (!hazir || !ses.src) return;
    a.not.textContent = navigator.onLine === false ? "Ses kaydı bu cihaza indirilmemiş; internetsizken çalınamaz. Cihazın sesli okuması deneniyor." : "Ses kaydı açılamadı; cihazın sesli okuması deneniyor.";
    temizle();
    devir = yedek();
  });
  const temizle = () => { ses.pause(); ses.removeAttribute("src"); try { ses.load(); } catch (e) {} if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = null; };
  a.ana.onclick = async () => { if (devir) return; await yukle(); if (ses.paused) ses.play().catch(() => {}); else ses.pause(); };
  a.geri.onclick = () => { ses.currentTime = Math.max(0, ses.currentTime - 15); };
  a.ileri.onclick = () => { ses.currentTime = Math.min(ses.duration || 0, ses.currentTime + 15); };
  a.bastan.onclick = () => { ses.currentTime = 0; ses.play().catch(() => {}); };
  a.hiz.onchange = () => { ses.playbackRate = +a.hiz.value; };
  a.ilerleme.oninput = () => { if (ses.duration) ses.currentTime = (a.ilerleme.value / 1000) * ses.duration; };
  return { tur: "kayit", dur() { temizle(); if (devir) devir.dur(); }, ses };
}

async function turkceSes() {
  const ss = window.speechSynthesis;
  let sesler = ss.getVoices();
  if (!sesler.length) {
    await new Promise((r) => { const t = setTimeout(r, 1500); ss.addEventListener("voiceschanged", () => { clearTimeout(t); r(); }, { once: true }); });
    sesler = ss.getVoices();
  }
  return sesler.find((v) => /^tr([-_]|$)/i.test(v.lang)) || null;
}
function cihazSesi(a, ic) {
  const ss = window.speechSynthesis;
  const KARAKTER_SN = 14; // 1× hızda saniyede yaklaşık karakter (süre tahmini için)
  let iptal = false;
  if (!ss || !window.SpeechSynthesisUtterance) {
    a.ana.disabled = true; a.etkin(false);
    a.not.textContent = "Bu tarayıcı sesli okumayı desteklemiyor. Rehberi yukarıdan okuyabilirsin.";
    return { tur: "yok", dur() {} };
  }
  const cumleler = anlatimMetni(ic).split(/(?<=[.!?…])\s+/).filter((x) => x.trim());
  const birikim = []; let t = 0;
  for (const c of cumleler) { birikim.push(t); t += c.length; }
  const toplamKarakter = t;
  let sira = 0, calisiyor = false, jeton = 0, ses = null, hazir = false;
  const hiz = () => +a.hiz.value || 1;
  const goster = () => {
    const kar = birikim[Math.min(sira, cumleler.length - 1)] || 0;
    a.ilerleme.value = Math.round((kar / toplamKarakter) * 1000);
    a.simdi.textContent = sureYaz(kar / (KARAKTER_SN * hiz()));
    a.toplam.textContent = "~" + sureYaz(toplamKarakter / (KARAKTER_SN * hiz()));
  };
  const konus = () => {
    const benim = ++jeton;
    ss.cancel();
    if (sira >= cumleler.length) { calisiyor = false; a.calisiyor(false); sira = 0; goster(); return; }
    const u = new SpeechSynthesisUtterance(cumleler[sira]);
    u.lang = "tr-TR"; if (ses) u.voice = ses; u.rate = hiz();
    u.onend = () => { if (benim !== jeton || iptal) return; sira++; goster(); konus(); };
    u.onerror = (e) => { if (benim !== jeton || iptal) return; if (e.error === "interrupted" || e.error === "canceled") return; calisiyor = false; a.calisiyor(false); a.not.textContent = "Sesli okuma durdu (" + (e.error || "hata") + ")."; };
    calisiyor = true; a.calisiyor(true); goster();
    ss.speak(u);
  };
  const durdur = () => { jeton++; ss.cancel(); calisiyor = false; a.calisiyor(false); };
  const atla = (sn) => {
    const hedef = (birikim[sira] || 0) + sn * KARAKTER_SN * hiz();
    let i = 0; while (i < cumleler.length - 1 && birikim[i + 1] <= hedef) i++;
    sira = Math.max(0, Math.min(cumleler.length - 1, i));
    goster(); if (calisiyor) konus();
  };
  a.ana.disabled = true;
  a.not.textContent = "Cihazın Türkçe sesi aranıyor…";
  turkceSes().then((v) => {
    if (iptal) return;
    if (!v) {
      a.ana.disabled = true; a.etkin(false);
      a.not.textContent = "Bu cihazda Türkçe metin okuma sesi bulunamadı. Telefonun ayarlarından Türkçe ses yükleyebilir ya da rehberi okuyabilirsin.";
      return;
    }
    ses = v; hazir = true;
    a.ana.disabled = false; a.etkin(true); goster();
    a.not.textContent = `Cihazın Türkçe sesiyle okunuyor (${v.name}).` + (v.localService ? " Bu ses cihazda kurulu." : " Bu ses internet gerektirebilir.");
  });
  a.ana.onclick = () => { if (!hazir) return; if (calisiyor) durdur(); else konus(); };
  a.geri.onclick = () => atla(-15);
  a.ileri.onclick = () => atla(15);
  a.bastan.onclick = () => { sira = 0; goster(); konus(); };
  a.hiz.onchange = () => { goster(); if (calisiyor) konus(); };
  a.ilerleme.oninput = () => {
    const hedef = (a.ilerleme.value / 1000) * toplamKarakter;
    let i = 0; while (i < cumleler.length - 1 && birikim[i + 1] <= hedef) i++;
    sira = i; goster(); if (calisiyor) konus();
  };
  return { tur: "cihaz", dur() { iptal = true; durdur(); } };
}

// --- İndirilenler ve depolama
const MB = (b) => (b / 1048576).toFixed(1).replace(".", ",") + " MB";
async function medyaKaydet(mk, u) {
  try { const x = await fetch(u, { mode: "cors" }); if (x.ok) { await mk.put(u, x); return true; } } catch (e) {}
  try { const x = await fetch(u, { mode: "no-cors" }); if (x.type === "opaque" || x.ok) { await mk.put(u, x); return true; } } catch (e) {}
  return false;
}
function indirilenIller() { try { return JSON.parse(ayarOku("rehberIller") || "{}"); } catch (e) { return {}; } }
async function depoAc() {
  $("depoPanel").hidden = false;
  await depoCiz();
  $("depoKapat").focus();
}
async function depoCiz() {
  const kutu = $("depoIcerik");
  let h = "";
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const t = await navigator.storage.estimate();
      const kalici = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      h += `<p class="durum-satir">Bu uygulamanın kullandığı alan: <b>${MB(t.usage || 0)}</b>${t.quota ? ` (ayrılabilen ${MB(t.quota)})` : ""}.${kalici ? " Tarayıcı bu kayıtları silmeyecek şekilde işaretli." : ""}</p>`;
    } catch (e) {}
  }
  const ix = await yerelIndeksi();
  const tamam = ix && ayarOku("indirilenTarih") === ix.tarih;
  h += `<p class="durum-satir">${tamam ? "✅" : "⬜"} Türkiye yer listesi (81 il)${tamam ? " telefonda" : " henüz tam inmedi"}.</p>`;
  let medya = 0, rehberMetin = 0;
  if ("caches" in window) {
    try { medya = (await (await caches.open(MEDYA_KABI)).keys()).length; rehberMetin = (await (await caches.open(REHBER_KABI)).keys()).filter((r) => /\/icerik\/il\//.test(r.url)).length; } catch (e) {}
  }
  h += `<p class="durum-satir">Telefondaki il rehberi dosyası: <b>${rehberMetin}</b> · İndirilen fotoğraf ve ses: <b>${medya}</b> dosya</p>`;
  await rehberDiziniYukle();
  const plaka = +el.il.value || 0;
  if (plaka) {
    const sayi = rehberDizin ? Object.values(rehberDizin.sayfalar).filter((s) => s.p.includes(plaka)).length : 0;
    h += `<h2 style="font-size:17px;margin-top:16px">${kacir(ilAdi(plaka))} rehberi</h2>`;
    if (!sayi) h += `<p class="durum-satir">Bu ilde henüz hazırlanmış rehber yok.</p>`;
    else h += `<p class="durum-satir">${sayi} yerin doğrulanmış rehberi var.</p>
      <label class="durum-satir"><input type="checkbox" id="ilMedya"> Fotoğrafları ve ses kayıtlarını da indir (daha fazla yer kaplar)</label>
      <button type="button" class="indir-dugme" id="ilIndir">📥 ${kacir(ilAdi(plaka))} rehberini internetsiz kullanım için indir</button>`;
  } else h += `<p class="durum-satir">Bir ilin rehberini indirmek için önce yukarıdan il seç.</p>`;
  const iller = Object.entries(indirilenIller());
  if (iller.length) h += `<p class="durum-satir">İndirdiğin il rehberleri: ${iller.map(([p, t]) => `${kacir(ilAdi(+p))} (${kacir(tarihGoster(t))})`).join(", ")}</p>`;
  h += `<button type="button" class="indir-dugme" id="medyaTemizle">🗑️ İndirilen fotoğraf ve sesleri sil</button>
    <p class="kucuk-not">Yazılı rehberler ve yer listesi silinmez; yalnız fotoğraf ve ses dosyaları silinir.</p>`;
  kutu.innerHTML = h;
  const d = $("ilIndir");
  if (d) d.addEventListener("click", () => ilRehberiniIndir(plaka, $("ilMedya").checked, d));
  $("medyaTemizle").addEventListener("click", async () => { if ("caches" in window) await caches.delete(MEDYA_KABI); depoCiz(); });
}
async function ilRehberiniIndir(plaka, medyaDa, dugme) {
  if (navigator.onLine === false) { dugme.textContent = "İnternet yok; bağlanınca tekrar dene"; return; }
  dugme.disabled = true; dugme.textContent = "İndiriliyor…";
  let hata = 0;
  try {
    const rk = await caches.open(REHBER_KABI);
    const metinUrl = mutlak(`icerik/il/${iki(plaka)}.json`);
    const r = await fetch(metinUrl, { cache: "reload", headers: TAZELE });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const il = await r.clone().json();
    await rk.put(metinUrl, r);
    ilRehberleri.delete(plaka);
    await fetch(`veri/gorsel/${iki(plaka)}.json`, { cache: "reload", headers: TAZELE }).catch(() => hata++); // sw.js veri kabına yazar
    if (medyaDa) {
      const mk = await caches.open(MEDYA_KABI);
      const gorselListesi = await fetch(`veri/gorsel/${iki(plaka)}.json`).then((x) => (x.ok ? x.json() : {})).catch(() => ({}));
      const qler = new Set(Object.entries(rehberDizin ? rehberDizin.yerler : {}).filter(([q, a]) => /^Q/.test(q) && il[a]).map(([q]) => q));
      for (const q of qler) for (const f of gorselListesi[q] || []) for (const u of [...new Set([f.u, f.b].filter(Boolean))]) {
        if (!(await medyaKaydet(mk, u))) hata++;
      }
      for (const ic of Object.values(il)) if (ic.ses) {
        try { const u = mutlak(ic.ses.dosya); const x = await fetch(u); if (x.ok) await mk.put(u, x); else hata++; } catch (e) { hata++; }
      }
    }
    const kayit = indirilenIller(); kayit[plaka] = new Date().toISOString().slice(0, 10); ayarYaz("rehberIller", JSON.stringify(kayit));
  } catch (e) { hata++; }
  dugme.disabled = false;
  dugme.textContent = hata ? "Bir kısmı indirilemedi; tekrar dene" : "✅ İndirildi";
  depoCiz();
}

function rehberKur() {
  el.icerik.addEventListener("click", (e) => {
    const b = e.target.closest("button.git[data-x]");
    if (!b || !durum.sonListe) return;
    detayAc(durum.sonListe[+b.dataset.x]);
  });
  $("detayGeri").addEventListener("click", () => detayKapat(false));
  window.addEventListener("popstate", () => { if (!$("detay").hidden && !(history.state && history.state.detay)) detayKapat(true); });
  $("buyukKapat").addEventListener("click", buyukKapat);
  $("buyukOnceki").addEventListener("click", () => buyukAc(buyukSira - 1));
  $("buyukSonraki").addEventListener("click", () => buyukAc(buyukSira + 1));
  $("depoAc").addEventListener("click", depoAc);
  $("depoKapat").addEventListener("click", () => { $("depoPanel").hidden = true; $("depoAc").focus(); });
  $("depoPanel").addEventListener("click", (e) => { if (e.target === $("depoPanel")) $("depoPanel").hidden = true; });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("buyukFoto").hidden) buyukKapat();
    else if (!$("depoPanel").hidden) $("depoPanel").hidden = true;
    else if (!$("detay").hidden) detayKapat(false);
  });
  if (location.hash === "#yer") history.replaceState(null, "", location.pathname + location.search);
  rehberDiziniYukle();
}

el.il.addEventListener("change", () => ilSecildi(+el.il.value || 0));
el.ilce.addEventListener("change", () => ilceSecildi());
el.yakin.addEventListener("click", yakinimdakiler);
el.ara.addEventListener("input", () => { durum.arama = el.ara.value; durum.gosterilen = SAYFA; listeyiCiz(); });
el.cipler.addEventListener("click", (e) => {
  const b = e.target.closest(".cip");
  if (!b) return;
  durum.filtre = b.dataset.k === durum.filtre ? "" : b.dataset.k;
  durum.gosterilen = SAYFA;
  for (const c of el.cipler.querySelectorAll(".cip")) c.setAttribute("aria-pressed", String(c.dataset.k === durum.filtre));
  listeyiCiz();
});

ilSecenekleri();
uygulamaKur();
rehberKur();
// Uygulama açılır açılmaz değil, ilk ekran çizildikten biraz sonra
setTimeout(turkiyeyiIndir, 1500);
(function () {
  const sonIl = +(ayarOku("il") || 0);
  if (sonIl && ILLER.some((i) => i[0] === sonIl)) {
    el.il.value = String(sonIl);
    ilSecildi(sonIl, ayarOku("ilce"));
  } else baslangic();
})();
